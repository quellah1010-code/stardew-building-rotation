<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
<rect width="1440" height="980" fill="#f6f3ec"/>
<g font-family="DejaVu Sans, sans-serif" fill="#26372f">
<text x="40" y="54" font-size="28" fill="#26372f">SHED / INTERIOR ROTATION — OPERATION STUDY</text>
<text x="40" y="87" font-size="18" fill="#627268">Candidate interface. The two furnished-room approaches remain separate choices.</text>
<rect x="35" y="115" width="670" height="365" rx="12" fill="#fff"/>
<text x="57" y="155" font-size="22" fill="#26372f">01 / PICK UP &amp; PREVIEW</text>
<rect x="735" y="115" width="670" height="365" rx="12" fill="#fff"/>
<text x="757" y="155" font-size="22" fill="#26372f">02 / FURNISHED ROOM</text>
<rect x="35" y="515" width="670" height="365" rx="12" fill="#fff"/>
<text x="57" y="555" font-size="22" fill="#26372f">03 / PACKING REVIEW</text>
<rect x="735" y="515" width="670" height="365" rx="12" fill="#fff"/>
<text x="757" y="555" font-size="22" fill="#26372f">04 / RESULT</text>
<text x="57" y="205" font-size="22" fill="#26372f">Rotate interior with building</text>
<rect x="575" y="178" width="91" height="40" rx="20" fill="#e8eee8"/>
<text x="594" y="205" font-size="18" fill="#26372f">OFF</text>
<text x="57" y="247" font-size="20" fill="#26372f">OFF: exterior turns; current room stays.</text>
<text x="57" y="282" font-size="20" fill="#26372f">ON + empty: preview the supported room turn.</text>
<text x="57" y="317" font-size="20" fill="#26372f">ON + furnished: choose how to handle contents.</text>
<rect x="57" y="372" width="175" height="43" rx="7" fill="#e8eee8"/>
<text x="71" y="400" font-size="17" fill="#26372f">Cancel move</text>
<rect x="440" y="372" width="225" height="43" rx="7" fill="#2f7770"/>
<text x="454" y="400" font-size="17" fill="#fff">Place preview</text>
<text x="757" y="205" font-size="20" fill="#26372f">This room contains a chest and four kegs.</text>
<text x="757" y="243" font-size="20" fill="#26372f">Pack first: move contents to storage, then</text>
<text x="757" y="273" font-size="20" fill="#26372f">turn the room. You will need to place them again.</text>
<text x="757" y="311" font-size="19" fill="#627268">Keep-and-turn layout is a separate future route.</text>
<rect x="757" y="372" width="180" height="43" rx="7" fill="#e8eee8"/>
<text x="771" y="400" font-size="17" fill="#26372f">Keep interior</text>
<rect x="1060" y="372" width="300" height="43" rx="7" fill="#2f7770"/>
<text x="1074" y="400" font-size="17" fill="#fff">Review packing</text>
<text x="57" y="602" font-size="20" fill="#26372f">Show the exact contents and machine states.</text>
<text x="57" y="640" font-size="20" fill="#26372f">Show required crates and reachable positions.</text>
<text x="57" y="678" font-size="20" fill="#26372f">Nothing has moved yet. Cancel returns to preview.</text>
<text x="57" y="715" font-size="19" fill="#a05740">Unsupported state: name the object and stop.</text>
<rect x="57" y="781" width="170" height="43" rx="7" fill="#e8eee8"/>
<text x="71" y="809" font-size="17" fill="#26372f">Back</text>
<rect x="404" y="781" width="260" height="43" rx="7" fill="#2f7770"/>
<text x="418" y="809" font-size="17" fill="#fff">Pack &amp; place room</text>
<text x="757" y="602" font-size="20" fill="#26372f">Exterior and room orientation are committed.</text>
<text x="757" y="640" font-size="20" fill="#26372f">Stored items are available in the shown crates.</text>
<text x="757" y="678" font-size="20" fill="#26372f">The floor is cleared; the old layout is not rebuilt.</text>
<text x="757" y="716" font-size="19" fill="#627268">Record the result, then close the move session.</text>
<rect x="1158" y="781" width="195" height="43" rx="7" fill="#2f7770"/>
<text x="1172" y="809" font-size="17" fill="#fff">Done</text>
<text x="40" y="922" font-size="19" fill="#26372f">Empty rooms skip packing. Packing confirmation belongs to final placement, not to flipping the switch.</text>
<text x="40" y="952" font-size="18" fill="#627268">This board does not implement item movement, prescribe crate prices, or change the empty Barn prototype.</text>
</g></svg>
