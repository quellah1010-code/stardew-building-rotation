<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="429" viewBox="0 0 800 268" role="img" aria-labelledby="title desc">
<title id="title">Stable four-direction ground and doorway guides</title>
<desc id="desc">Construction guides, not building artwork. Gray tiles block. Cyan is a human door; orange is an animal door. Door overlays do not carve collision. Dashed rectangles are one-tile approaches.</desc>
<rect width="800" height="268" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a">
<text x="24" y="23" font-size="15" font-weight="bold">Stable / art alignment guides / 16 source px per tile</text>
<g transform="translate(32 64)">
<text x="0" y="-15" font-size="12">South / 64 x 96</text>
<rect x="0" y="0" width="64" height="96" fill="#edf2f7" stroke="#94a3b8" stroke-dasharray="3 3"/>
<rect x="0" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="32" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="48" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="0" y="80" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="80" width="16" height="16" fill="#ffffff" stroke="#64748b" stroke-width="0.5"/>
<rect x="32" y="80" width="16" height="16" fill="#ffffff" stroke="#64748b" stroke-width="0.5"/>
<rect x="48" y="80" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<circle cx="0" cy="64" r="2" fill="#111827"/>
</g>
<g transform="translate(232 64)">
<text x="0" y="-15" font-size="12">East / 32 x 128</text>
<rect x="0" y="0" width="32" height="128" fill="#edf2f7" stroke="#94a3b8" stroke-dasharray="3 3"/>
<rect x="0" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="0" y="80" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="80" width="16" height="16" fill="#ffffff" stroke="#64748b" stroke-width="0.5"/>
<rect x="0" y="96" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="96" width="16" height="16" fill="#ffffff" stroke="#64748b" stroke-width="0.5"/>
<rect x="0" y="112" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="112" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<circle cx="0" cy="64" r="2" fill="#111827"/>
</g>
<g transform="translate(432 64)">
<text x="0" y="-15" font-size="12">North / 64 x 96</text>
<rect x="0" y="0" width="64" height="96" fill="#edf2f7" stroke="#94a3b8" stroke-dasharray="3 3"/>
<rect x="0" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="64" width="16" height="16" fill="#ffffff" stroke="#64748b" stroke-width="0.5"/>
<rect x="32" y="64" width="16" height="16" fill="#ffffff" stroke="#64748b" stroke-width="0.5"/>
<rect x="48" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="0" y="80" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="80" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="32" y="80" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="48" y="80" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<circle cx="0" cy="64" r="2" fill="#111827"/>
</g>
<g transform="translate(632 64)">
<text x="0" y="-15" font-size="12">West / 32 x 128</text>
<rect x="0" y="0" width="32" height="128" fill="#edf2f7" stroke="#94a3b8" stroke-dasharray="3 3"/>
<rect x="0" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="64" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="0" y="80" width="16" height="16" fill="#ffffff" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="80" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="0" y="96" width="16" height="16" fill="#ffffff" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="96" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="0" y="112" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<rect x="16" y="112" width="16" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
<circle cx="0" cy="64" r="2" fill="#111827"/>
</g>
<text x="24" y="230" font-size="11">Gray: blocked / White: open / Cyan: human door / Orange: animal door / Dot: threshold</text>
<text x="24" y="250" font-size="11">Ground-plane guides only. Redraw the building elevations; no raster rotation. North reveal must use the real door.</text>
</g></svg>
